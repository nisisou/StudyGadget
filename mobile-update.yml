name: Mobile CI
run-name: Mobile CI / ${{ inputs.target || vars.MOBILE_CI_TARGET || '3ds' }} / ${{ github.ref_name }}${{ inputs.request_id && format(' / {0}', inputs.request_id) || '' }}
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target (3DS only needs no signing secret)'
        type: choice
        options: ['3ds', 'both', 'android']
        default: '3ds'
        required: true
      request_id:
        description: 'App request ID (leave blank for manual builds)'
        type: string
        required: false
      version_code:
        description: 'Android versionCode (blank = 100000 + CI run number)'
        type: string
        required: false
      version_name:
        description: 'Display version (blank = automatic)'
        type: string
        required: false
  push:
    branches: [main, master]
    paths: ['.github/workflows/mobile-update.yml', 'assets/**', 'character/model.sgch', 'character/motions.sgmo', 'character/manifest.json', 'tools/**', 'ci/**', 'home-menu/**', 'Makefile']
permissions:
  contents: read
concurrency:
  group: mobile-ci-${{ github.ref }}-${{ inputs.target || vars.MOBILE_CI_TARGET || '3ds' }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      target: ${{ steps.plan.outputs.target }}
      version_code: ${{ steps.plan.outputs.version_code }}
      version_name: ${{ steps.plan.outputs.version_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: plan
        env:
          CI_TARGET: ${{ inputs.target || vars.MOBILE_CI_TARGET || '3ds' }}
          CI_VERSION_CODE: ${{ inputs.version_code }}
          CI_VERSION_NAME: ${{ inputs.version_name }}
        run: python3 tools/mobile_ci.py plan

  android:
    needs: plan
    if: needs.plan.outputs.target == 'android' || needs.plan.outputs.target == 'both'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            assets/**/*.gradle.kts
            assets/gradle/libs.versions.toml
            assets/gradle/wrapper/gradle-wrapper.properties
      - name: Restore and verify the original Android signing key
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: python3 tools/mobile_ci.py restore-signing
      - name: Build and test Android
        env:
          VERSION_CODE: ${{ needs.plan.outputs.version_code }}
          VERSION_NAME: ${{ needs.plan.outputs.version_name }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          chmod +x assets/gradlew
          cd assets
          ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest \
            "-PappVersionCode=$VERSION_CODE" "-PappVersionName=$VERSION_NAME"
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs assets/app/build/outputs/apk/debug/app-debug.apk'
      - uses: actions/upload-artifact@v7
        with:
          name: android-binary
          path: assets/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
      - name: Remove temporary signing key
        if: always()
        run: |
          python3 - <<'PY'
          import os,pathlib
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'studygadget-signing'/'debug.keystore').unlink(missing_ok=True)
          PY

  three_ds:
    needs: plan
    if: needs.plan.outputs.target == '3ds' || needs.plan.outputs.target == 'both'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare icons, character assets, and HOME banner CGFX
        run: |
          python3 -m venv "$RUNNER_TEMP/character-python"
          "$RUNNER_TEMP/character-python/bin/pip" install --disable-pip-version-check numpy pillow gltflib
          "$RUNNER_TEMP/character-python/bin/python" tools/test_character.py
          "$RUNNER_TEMP/character-python/bin/python" tools/export_home_banner.py
          if [ ! -f home-menu/banner.cgfx ]; then
            git clone https://github.com/dnasdw/pycgfx.git "$RUNNER_TEMP/pycgfx"
            git -C "$RUNNER_TEMP/pycgfx" checkout 1f78850086f3a77c41e07162e842f97a5bf3c18a
            "$RUNNER_TEMP/character-python/bin/python" tools/convert_home_cgfx.py \
              --source home-menu/banner.glb \
              --output home-menu/banner.cgfx \
              --pycgfx "$RUNNER_TEMP/pycgfx" \
              --report home-menu/cgfx-inspection.json
          fi
      - name: Compile 3DSX and ELF from source using devkitPro
        env:
          DEVKITPRO_IMAGE: ${{ vars.DEVKITPRO_IMAGE || 'devkitpro/devkitarm:latest' }}
        run: |
          docker run --rm --volume "$PWD:/project" --workdir /project \
            "$DEVKITPRO_IMAGE" bash tools/ci/build-3ds.sh
      - name: Build and verify CIA for FBI QR install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git cmake
          bash tools/ci/build-cia.sh
          "$RUNNER_TEMP/character-python/bin/python" tools/verify_home_cia.py \
            --cia assets/studygadget.cia \
            --cgfx home-menu/banner.cgfx \
            --source home-menu/banner.glb
      - uses: actions/upload-artifact@v7
        with:
          name: three-ds-binary
          path: |
            assets/studygadget.3dsx
            assets/studygadget.cia
          if-no-files-found: error
          retention-days: 3

  bundle:
    needs: [plan, android, three_ds]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
          (needs.android.result == 'success' || needs.android.result == 'skipped') &&
          (needs.three_ds.result == 'success' || needs.three_ds.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        if: needs.android.result == 'success'
        with:
          name: android-binary
          path: incoming/android
      - uses: actions/download-artifact@v8
        if: needs.three_ds.result == 'success'
        with:
          name: three-ds-binary
          path: incoming/3ds
      - name: Package a verified phone import file
        env:
          TARGET: ${{ needs.plan.outputs.target }}
          VERSION_NAME: ${{ needs.plan.outputs.version_name }}
        run: python3 tools/mobile_ci.py bundle --target "$TARGET" --version "$VERSION_NAME"
      - uses: actions/upload-artifact@v7
        id: phone_update
        with:
          path: outgoing/StudyGadget-update.sgupdate
          archive: false
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        id: diagnostics
        with:
          name: mobile-build-files
          path: |
            outgoing/StudyCompanion.apk
            outgoing/studygadget.3dsx
            outgoing/studygadget.cia
            outgoing/SHA256SUMS.txt
            outgoing/build-info.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Show phone instructions and download link
        env:
          UPDATE_URL: ${{ steps.phone_update.outputs.artifact-url }}
          FILES_URL: ${{ steps.diagnostics.outputs.artifact-url }}
          TARGET: ${{ needs.plan.outputs.target }}
          VERSION_NAME: ${{ needs.plan.outputs.version_name }}
        run: |
          python3 - <<'PY'
          import os,pathlib
          text=('## Phone update is ready\n\n'
                '- Target: '+os.environ['TARGET']+'\n'
                '- Version: '+os.environ['VERSION_NAME']+'\n'
                '- [Download StudyGadget-update.sgupdate]('+os.environ['UPDATE_URL']+')\n'
                '- [APK / 3DSX / CIA / checksums]('+os.environ['FILES_URL']+')\n\n'
                'Save the .sgupdate on the phone, then Study Companion > Updates > Select update file.\n\n'
                'If a ZIP wrapper is downloaded, extract that outer ZIP only. Keep .sgupdate intact.\n\n'
                '3DS: HBL (UPDATE > INSTALL) or FBI (Remote Install > Scan QR Code in Update screen).\n')
          with pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).open('a',encoding='utf-8') as f:f.write(text)
          PY
